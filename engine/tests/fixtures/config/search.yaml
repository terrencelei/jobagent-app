# Indeed, read through the Indeed app's job-search API (discovery/indeed.py). Indeed's web pages
# block automated browsers; the app endpoint answers JSON. Only postings whose apply link is the
# employer's own page are kept. Indeed's search syntax: quotes, OR, parentheses, -word to exclude.
# How often this runs, how many results per query and the posting age window are dashboard
# settings under "Indeed search".
indeed:
  location: "United States"
  resolve_redirect_hosts: [grnh.se]
  queries:
    # Mechanical Engineering track
    - 'mechanical engineer ("new grad" OR "new graduate" OR "entry level" OR "early career" OR "engineer I" OR associate)'
    - '("mechanical design engineer" OR "product design engineer" OR "design engineer") -senior -principal -staff -lead'
    - '(robotics OR mechatronics) engineer -senior -principal -staff -lead -software'
    - '("manufacturing engineer" OR "process engineer" OR "equipment engineer") ("new grad" OR "entry level" OR "engineer I" OR associate)'
    - '("test engineer" OR "reliability engineer" OR "hardware engineer") ("new grad" OR "entry level" OR "early career" OR "engineer I")'
    - '(aerospace OR propulsion OR structures OR thermal) engineer ("new grad" OR "entry level" OR "early career" OR "engineer I")'
    - '("controls engineer" OR "automation engineer" OR "systems engineer") ("new grad" OR "entry level" OR "engineer I" OR associate)'
    - '"technical program manager" (associate OR "new grad" OR "entry level" OR "early career")'
    # Statistics & Data Science track
    - '"data scientist" ("new grad" OR "new graduate" OR "entry level" OR "early career" OR associate OR junior)'
    - '("data analyst" OR "analytics engineer" OR "business intelligence analyst") ("new grad" OR "entry level" OR junior OR associate)'
    - '(statistician OR "quantitative analyst" OR "machine learning engineer") ("new grad" OR "entry level" OR "early career" OR junior)'

# LinkedIn's public (signed-out) job search (discovery/linkedin.py). Each result is a lead (company,
# title, location): the posting is then found on Indeed's app API, which carries the employer's
# apply link, or by the web-search agent. LinkedIn keyword syntax: quotes, OR, NOT, parentheses.
# How often this runs, results per query and the agent-search cap are settings under "LinkedIn search".
linkedin:
  location: "United States"
  queries:
    # Mechanical Engineering track
    - 'mechanical engineer new grad'
    - 'mechanical engineer "early career"'
    - '"mechanical design engineer" OR "product design engineer" "entry level"'
    - 'robotics engineer OR mechatronics engineer "entry level" NOT senior'
    - 'manufacturing engineer OR "process engineer" new grad'
    - '"test engineer" OR "hardware engineer" new grad'
    - 'aerospace engineer OR propulsion engineer "early career"'
    - '"technical program manager" associate OR "new grad"'
    # Statistics & Data Science track
    - '"data scientist" new grad OR "entry level"'
    - '"data analyst" OR "analytics engineer" "entry level"'
    - '"machine learning engineer" OR statistician new grad'

# sign in once with `jobagent handshake-login`). Plain keyword searches; each result that applies on
# the employer's site is kept, the rest are leads resolved on Indeed or by the web-search agent.
handshake:
  school: 'utexas'
  queries:
    - 'mechanical engineer'
    - 'mechanical design engineer'
    - 'manufacturing engineer'
    - 'robotics engineer'
    - 'test engineer'
    - 'aerospace engineer'
    - 'data scientist'
    - 'data analyst'
