# Search configuration for JobAgent

# Curated public job lists. Repo names/categories do not establish eligibility:
# leads without employer requirements go to Needs Review, using the saved profile.
github_sources:
  - repository: SimplifyJobs/New-Grad-Positions
    ref: dev
    path: .github/scripts/listings.json
    format: simplify_json
    max_jobs: 1000
  - repository: TrakkerHQ/hardware-jobs
    ref: main
    path: README.md
    format: markdown
    max_jobs: 250
  - repository: zapplyjobs/New-Grad-Hardware-Engineering-Jobs-2027
    ref: main
    path: README.md
    format: markdown
    max_jobs: 500
    resolve_redirect_hosts: [zapply.jobs, www.zapply.jobs]

cadence:
  # Search continuously: start a full scan every 15 minutes (or right after a longer one ends).
  discovery_interval_minutes: 15
  high_priority_verify_hours: 4
  normal_verify_hours: 12
  old_verify_days: 1
  request_delay_seconds: 1.0
  max_concurrent_requests_per_domain: 2

