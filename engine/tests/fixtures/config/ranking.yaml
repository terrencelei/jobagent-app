# Ranking and Scoring Configuration for JobAgent

weights:
  semantic_role_match: 25.0
  technical_skill_match: 20.0
  experience_match: 20.0
  industry_match: 10.0
  early_career_fit: 10.0
  role_preference: 5.0
  location_preference: 5.0
  company_preference: 5.0

priority_formula:
  relevance_weight: 0.75
  urgency_weight: 0.25
  focus_title_boost: 15.0

early_career_boost:
  keywords:
    - "2027 new grad"
    - "2027 university graduate"
    - "2027 university hire"
    - "class of 2027"
    - "summer 2027"
    - "june 2027"
    - "university graduate"
    - "university hire"
    - "new grad"
    - "entry level"
    - "early career"
    - "associate engineer"
    - "engineer i"
    - "level 1"
    - "rotational engineer"
  boost_points: 15.0

# robotics over defense, aerospace and automotive, so the company-preference component
# ranks by sector rather than by a flat list of names. Points are out of the
# weights.company_preference maximum.
company_preference:
