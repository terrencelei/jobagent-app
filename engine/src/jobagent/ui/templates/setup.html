<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup · JobAgent</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="applications.css">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh}
    #shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
    #rail{background:var(--forest);color:#fff;padding:34px 24px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
    #rail .brand{font-family:var(--display);font-size:28px;font-weight:600}
    #rail .brand small{display:block;font-family:inherit;font-size:13px;font-weight:400;color:rgba(255,255,255,.7);margin-top:4px;font-family:var(--font)}
    #steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
    #steps button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;color:rgba(255,255,255,.78);font-size:14px;cursor:pointer}
    #steps button:disabled{cursor:default;opacity:.5}
    #steps button:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
    #steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid rgba(255,255,255,.35);flex:none}
    #steps li.done .n{background:rgba(255,255,255,.18);border-color:transparent}
    #steps li.current button{background:var(--tan);color:var(--forest-deep);font-weight:600}
    #steps li.current .n{border-color:var(--forest-deep)}
    #rail .foot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.66);line-height:1.5}
    main{padding:40px clamp(18px,4vw,64px) 120px;max-width:1040px}
    .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
    h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,44px);line-height:1.1;margin:8px 0 10px;color:var(--forest)}
    h2{font-size:17px;margin:0}
    .lede{color:var(--muted);font-size:15px;line-height:1.6;max-width:62ch;margin:0}
    .panel{margin-top:26px;padding:18px;border-radius:var(--r-panel);background:var(--panel-b);display:grid;gap:14px}
    .panel.tan{background:var(--panel-c)}
    .card{background:var(--surface);border-radius:var(--r-card);padding:18px;display:grid;gap:14px}
    .card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
    label,.label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--text)}
    label small,.label small{font-weight:400;color:var(--muted);line-height:1.45}
    .wide{grid-column:1/-1}
    input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--r-control);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
    textarea{min-height:96px;resize:vertical;line-height:1.5}
    input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--bad);background:var(--bad-bg)}
    .err{color:var(--bad);font-size:12px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none}
    .btn.primary{background:var(--tan);border-color:var(--tan-deep);color:var(--forest-deep);font-weight:600}
    .btn.dark{background:var(--forest);border-color:var(--forest);color:#fff}
    .btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
    .btn.small{padding:6px 12px;font-size:13px}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    #nav{position:fixed;left:300px;right:0;bottom:0;padding:14px clamp(18px,4vw,64px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
    #nav .where{font-size:13px;color:var(--muted)}
    .choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .choice{position:relative;display:grid;gap:4px;padding:16px;border-radius:var(--r-card);background:var(--surface);border:2px solid transparent;cursor:pointer;font-weight:400}
    .choice input{position:absolute;opacity:0;pointer-events:none}
    .choice strong{font-size:15px}
    .choice span{font-size:13px;color:var(--muted);line-height:1.45}
    .choice:has(input:checked){border-color:var(--forest);box-shadow:0 0 0 3px var(--accent-bg)}
    .choice:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
    .toggle{display:flex;align-items:flex-start;gap:14px;padding:16px;background:var(--surface);border-radius:var(--r-card);cursor:pointer}
    .toggle input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--forest)}
    .toggle strong{display:block;font-size:15px}
    .toggle span{font-size:13px;color:var(--muted);line-height:1.45}
    .tags{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line-strong);border-radius:var(--r-control);background:var(--bg);min-height:44px;align-items:center}
    .tags:focus-within{outline:2px solid var(--accent);outline-offset:1px}
    .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--accent-bg);border:1px solid var(--sky-deep);font-size:13px}
    .tag button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--muted)}
    .tag button:hover,.tag button:focus-visible{background:rgba(0,0,0,.08);color:var(--text)}
    .tags input{flex:1;min-width:140px;border:0;background:transparent;padding:6px}
    .tags input:focus{outline:none}
    #drop{display:grid;place-items:center;gap:8px;text-align:center;padding:34px;border:2px dashed var(--sky-deep);border-radius:var(--r-card);background:var(--surface);cursor:pointer}
    #drop.over{background:var(--accent-bg)}
    #drop i{font-size:28px;color:var(--forest)}
    .note{padding:12px 14px;border-radius:var(--r-control);background:var(--surface);font-size:13px;color:var(--muted);line-height:1.5}
    .note.good{background:var(--good-bg);color:var(--text)}
    .note.bad{background:var(--bad-bg);color:var(--text)}
    .review{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .review dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
    .review dt{color:var(--muted)}
    .review dd{margin:0;overflow-wrap:anywhere}
    .done-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
    .done-list li{display:flex;gap:10px;align-items:center;font-size:15px}
    .done-list i{color:var(--good)}
    .pills{display:flex;flex-wrap:wrap;gap:8px}
    .pill{padding:9px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
    .pill[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:#fff}
    .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .hidden{display:none!important}
    @media(max-width:860px){#shell{grid-template-columns:1fr}#rail{position:static;height:auto;padding:20px 16px;gap:14px}#steps{display:flex;overflow-x:auto;gap:6px}#steps button{white-space:nowrap}#steps .label-text{display:none}#rail .foot{display:none}#nav{left:0}main{padding:24px 16px 120px}}
    html.embedded #rail{display:none}html.embedded #shell{grid-template-columns:1fr}html.embedded #nav{left:0}
  </style>
</head>
<body>
<div id="shell">
  <aside id="rail" aria-label="Setup steps">
    <div class="brand">JobAgent<small>Setup</small></div>
    <ol id="steps"></ol>
    <p class="foot">Everything stays on this computer. You can run Setup again any time from the sidebar; it starts from what you saved.</p>
  </aside>
  <main>
    <form id="form" novalidate autocomplete="on"></form>
  </main>
</div>
<div id="nav">
  <button type="button" class="btn quiet" id="back"><i class="fa-solid fa-arrow-left"></i>Back</button>
  <span class="where" id="where" aria-live="polite"></span>
  <button type="button" class="btn primary" id="next">Continue<i class="fa-solid fa-arrow-right"></i></button>
</div>
<script src="setup.js"></script>
</body>
</html>
