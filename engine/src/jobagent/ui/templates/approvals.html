<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approvals · JobAgent</title>
  <link rel="stylesheet" href="applications.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    textarea, input, select, button { font: inherit; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 26px; margin: 0; }
    h2 { font-size: 16px; font-weight: 600; color: var(--text); margin: 34px 0 12px; }
    a { color: var(--accent); }
    .lede { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
    .card-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
    .card-head strong { font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; }
    .reason { margin: 10px 0 0; font-size: 14px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .card .app-form { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 4px; }
    .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .shot { display: block; max-width: 100%; max-height: 520px; margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: rgba(127,178,255,.4); color: var(--text); }
    .badge.warn { background: rgba(240,179,64,.16); color: var(--attention); }
    #notice { position: sticky; top: 8px; z-index: 5; }
    textarea.grow { resize: none; display: block; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .grow-handle { display: flex; justify-content: center; align-items: center; height: 14px; margin-top: -1px; cursor: ns-resize; touch-action: none;
      border: 1px solid var(--line-strong); border-top: 0; border-radius: 0 0 7px 7px; background: var(--bg); }
    .grow-handle::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--faint); }
    .grow-handle:hover::before, .grow-handle:focus-visible::before { background: var(--accent); }
    .grow-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .resume-preview { display: block; width: 100%; max-width: 820px; aspect-ratio: 8.5 / 11; margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .resume-verify { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(240,179,64,.16); color: var(--attention); font-size: 13px; }
    .resume-verify ul { margin: 6px 0 0; padding-left: 20px; }
    .resume-editor { margin-top: 12px; }
    .resume-editor summary { cursor: pointer; color: var(--accent); }
    .resume-section { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; padding: 8px 12px; }
    .resume-section legend { font-weight: 700; font-size: 13px; }
    .resume-entry { border-top: 1px dashed var(--line); padding: 8px 0; }
    .resume-entry:first-of-type { border-top: 0; }
    .resume-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px; }
    .resume-section textarea { display: block; width: 100%; margin-top: 6px; font-family: "Times New Roman", Times, serif; font-size: 14px; }
    .resume-section input { min-width: 0; }
    label.app-button { cursor: pointer; }
  </style>
</head>
<body>
  <script>
    // Shown inside the dashboard's panel: the dashboard supplies Close, and its own links stay in the top window.
    if (window.self !== window.top) {
      document.documentElement.classList.add('embedded');
      document.addEventListener('click', event => {
        const link = event.target.closest('a[href="/#applications"], a[href="/"]');
        if (!link) return;
        event.preventDefault();
        window.parent.postMessage({jobagent: link.getAttribute('href') === '/' ? 'close-panel' : 'open-applications'}, location.origin);
      });
    }
  </script>

  <main>
    <header>
      <div>
        <h1>Approvals</h1>
        <p class="lede">Decisions only you can make: answers to new questions, resumes to tailor, final approval to submit, and account verification links. Workers keep going through Up next while these wait; each one continues as soon as you approve it.</p>
      </div>
      <button id="clearList" class="app-button" type="button" disabled>Clear list</button>
      <a class="app-button" href="/#applications" style="text-decoration:none">← Application Agent</a>
    </header>
    <div id="notice" class="app-notice" role="status" hidden></div>
    <p><a id="helpLink" href="/help" hidden></a></p>
    <p><button class="app-button" id="recheck" type="button" title="Sends every application waiting on questions back through. Each one comes back only with the questions that are still open.">Recheck with what the agent has learned</button></p>
    <section id="caps" aria-labelledby="capsTitle"></section>
    <div id="content"><p class="app-empty">Loading approvals…</p></div>
  </main>
  <script src="feedback.js"></script>
  <script src="approvals.js"></script>
</body>
</html>
